name: MacOSCleaner
options:
  bundleIdPrefix: input
  developmentLanguage: en

targets:
  MacOSCleaner:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - App
      - Domains
      - Features
      - Infrastructure
      - Models
      - path: Resources
        excludes:
          - engine_paths.json
          - ui_metadata.json
      - SharedViews
    preBuildScripts:
      - name: Pack Cleanup Catalog
        script: |
          set -euo pipefail
          ENGINE="$SRCROOT/Resources/engine_paths.json"
          UI="$SRCROOT/Resources/ui_metadata.json"
          MARKER="$SRCROOT/.require-private-catalog"
          if [[ -f "$MARKER" ]]; then
            export REQUIRE_PRIVATE_CATALOG=YES
          fi
          if [[ ! -f "$ENGINE" && ! -f "$UI" ]]; then
            if [[ "${REQUIRE_PRIVATE_CATALOG:-}" == "YES" ]]; then
              echo "error: build requires engine_paths.json + ui_metadata.json" >&2
              echo "error: place SoT under MacOSCleaner/Resources/ or remove $MARKER" >&2
              exit 1
            fi
            echo "Optional catalog SoT not present — continuing"
            touch "$DERIVED_FILE_DIR/cleanup_paths_verified.stamp"
            exit 0
          fi
          if [[ -f "$ENGINE" && ! -f "$UI" ]] || [[ ! -f "$ENGINE" && -f "$UI" ]]; then
            echo "error: both engine_paths.json and ui_metadata.json are required together" >&2
            exit 1
          fi
          # Maintainer machine: refresh catalog asset before compile when SoT is present.
          swift "$PROJECT_DIR/../scripts/generate_cleanup_paths.swift" --write
          touch "$DERIVED_FILE_DIR/cleanup_paths_verified.stamp"
        inputFiles:
          - $(SRCROOT)/Resources/engine_paths.json
          - $(SRCROOT)/Resources/ui_metadata.json
          - $(SRCROOT)/../scripts/generate_cleanup_paths.swift
          - $(SRCROOT)/../scripts/validate_engine_paths.py
        outputFiles:
          - $(DERIVED_FILE_DIR)/cleanup_paths_verified.stamp
          - $(SRCROOT)/Resources/Assets.xcassets/PrivateCleanupCatalog.dataset/catalog.bin
        basedOnDependencyAnalysis: true
    entitlements:
      path: MacOSCleaner.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: input.MacOSCleaner
        MARKETING_VERSION: 2.1.0
        CURRENT_PROJECT_VERSION: 2
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "MacOSCleaner needs to send Apple Events to close applications before cleaning their caches."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 MacOSCleaner. All rights reserved."
        SWIFT_COMPILATION_MODE: wholemodule
        DEAD_CODE_STRIPPING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CLANG_ANALYZER_NONNULL: YES
        GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
        COPY_PHASE_STRIP: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_COMPILATION_MODE: singlefile
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  MacOSCleanerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - MacOSCleanerTests
    dependencies:
      - target: MacOSCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: input.MacOSCleanerTests
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
